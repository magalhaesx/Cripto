name: Robô de alertas de compra
on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
permissions:
  contents: write   # para gravar o registro oficial de alertas (data/alerts-log.json)
concurrency: { group: signals, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - name: Restaurar alertas já enviados
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: signals-state-${{ github.run_id }}
          restore-keys: signals-state-
      - name: Analisar mercado e notificar
        env:
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"
          export SITE_URL="https://${OWNER,,}.github.io/${NAME}/"
          node scripts/check-signals.mjs
      - name: Gravar registro oficial de alertas
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "radar-cripto-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/alerts-log.json
            git commit -m "Registro de alertas: $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push --quiet origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
          fi
      - name: Salvar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: signals-state-${{ github.run_id }}
