<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Radar Cripto</title>
  <meta name="description" content="Alertas de compra de criptomoedas baseados em estatística, com gráficos em tempo real.">
  <meta name="theme-color" content="#131316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radar Cripto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="avatar"><img src="icons/icon-192.png" alt=""></div>
      <div>
        <div class="brand-title">Radar Cripto</div>
        <div class="live" id="live"><span class="dot"></span><span id="liveTxt">Conectando…</span></div>
      </div>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Atualizar">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </header>

  <main id="main">
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-signals"></section>
    <section class="view" id="view-sim"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span>
    </button>
    <button class="tab" data-view="signals">
      <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sinais</span><i class="badge" id="sigBadge" hidden></i>
    </button>
    <button class="tab" data-view="sim">
      <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3H5.5M3 7.5V18a2 2 0 0 0 2 2h15V8H5.5A2.5 2.5 0 0 1 3 7.5z" fill="none" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="14" r="1.6"/></svg><span>Carteira</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.11-1.65-2-3.46-2.49 1a7.3 7.3 0 0 0-1.68-.98L15 3h-4l-.37 2.44c-.6.24-1.17.57-1.68.98l-2.49-1-2 3.46 2.11 1.65a7.8 7.8 0 0 0 0 1.94l-2.11 1.65 2 3.46 2.49-1c.51.41 1.08.74 1.68.98L11 21h4l.37-2.44c.6-.24 1.17-.57 1.68-.98l2.49 1 2-3.46z"/></svg><span>Ajustes</span>
    </button>
  </nav>

  <div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-inner" id="sheetInner"></div></div>
  <div class="sheet" id="cmpSheet" aria-hidden="true"><div class="sheet-inner" id="cmpInner"></div></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
